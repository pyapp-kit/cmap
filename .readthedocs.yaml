# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
# and https://docs.readthedocs.com/platform/stable/intro/zensical.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    post_install:
      - pip install uv
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --all-extras --group docs --link-mode=copy
    build:
      html:
        - $READTHEDOCS_VIRTUALENV_PATH/bin/python docs/_gen_catalog.py
        - $READTHEDOCS_VIRTUALENV_PATH/bin/zensical build --strict
    post_build:
      - mkdir -p $READTHEDOCS_OUTPUT/html/
      - cp --recursive site/* $READTHEDOCS_OUTPUT/html/
