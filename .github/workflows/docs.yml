name: docs

# The docs are hosted on Read the Docs (see .readthedocs.yaml).
# This only checks that they build.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: 3.12
      - run: uv run --group docs python docs/_gen_catalog.py
      - run: uv run --group docs zensical build --strict
